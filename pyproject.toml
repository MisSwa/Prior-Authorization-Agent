[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before LangChain imports so env vars are set in time.
"app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
